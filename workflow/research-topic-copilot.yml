        code: "def main(llm_output):\n    import json\n    import re\n    \n    #\
          \ 1. Dify 直接将变量传进来了，如果为空则给默认的空 JSON 字符串\n    raw_text = llm_output if llm_output\
          \ else \"{}\"\n    \n    # 2. 核心防御机制：清理大模型可能带有的 Markdown 代码块标签 (如 ```json\
          \ ... ```)\n    cleaned_text = re.sub(r'^```[a-zA-Z]*\\n', '', raw_text.strip(),\
          \ flags=re.MULTILINE)\n    cleaned_text = re.sub(r'\\n```$', '', cleaned_text).strip()\n\
          \    \n    try:\n        # 3. 尝试解析干净的 JSON\n        data = json.loads(cleaned_text)\n\
          \        \n        status = data.get(\"intent_status\", \"UNKNOWN\")\n \
          \       reply = data.get(\"reply_to_user\", \"系统未生成回复，请重试。\")\n        \n\
          \        # 提取关键词并转为字符串\n        keywords_list = data.get(\"keywords\", [])\n\
          \        keywords_str = \", \".join(keywords_list) if isinstance(keywords_list,\
          \ list) else str(keywords_list)\n        \n    except Exception as e:\n\
          \        # 4. 终极兜底：万一连清理后都不是合法 JSON\n        status = \"ERROR\"\n      \
          \  reply = \"系统解析数据失败，大模型刚才似乎开小差了。能否换一种简单的描述方式重新告诉我？\"\n        keywords_str\
          \ = \"\"\n        \n    # 输出这三个干净的变量给下游的条件分支\n    return {\n        \"out_status\"\
          : status,\n        \"out_reply\": reply,\n        \"out_keywords\": keywords_str\n\
          \    }"
