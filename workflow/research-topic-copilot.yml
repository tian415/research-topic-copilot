          \   # 2. 清理可能存在的 ```json 等 Markdown 标签\n    cleaned_text = re.sub(r'^```[a-zA-Z]*\\\
          n', '', raw_text.strip(), flags=re.MULTILINE)\n    cleaned_text = re.sub(r'\\\
          n```$', '', cleaned_text).strip()\n    \n    try:\n        # 3. 解析纯净的 JSON\n\
          \        data = json.loads(cleaned_text)\n        \n        # 4. 提取回复字段，如果没有则用默认话术兜底\n\
          \        reply = data.get(\"reply_to_user\", \"导师觉得你的想法还需要再具象一点哦，请补充一下你的具体数据和资源条件~\"\
          )\n        \n    except Exception as e:\n        # 5. 终极异常兜底\n        reply\
